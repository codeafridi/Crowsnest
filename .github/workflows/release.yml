name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: "6.8.*"
          cache: true

      - name: Build, test and package universal DMG
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j3
          QT_QPA_PLATFORM=offscreen ctest --test-dir cpp/build --output-on-failure
          ./cpp/build/crowsnest.app/Contents/MacOS/crowsnest --dump \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["processCount"]>0 and d["host"]["cores"]>0; fs=d.get("filesystems",{}).get("entries",[]); assert fs and all(e["freeG"]<=e["totalG"]+0.01 for e in fs if "freeG" in e), fs[:3]; print("mac dump ok:", d["processCount"], "procs", len(fs), "fs")'
          CROWSNEST_BUILD_DIR=cpp/build bash cpp/packaging/build_macos.sh

      - name: Upload macos artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: |
            cpp/build/packaging/Crowsnest-*-macos.dmg
            cpp/build/packaging/Crowsnest-*-macos.dmg.sha256
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libgl-dev

      - name: Build and test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir cpp/build --output-on-failure

      - name: Build .deb
        run: bash cpp/packaging/build_deb.sh

      # The shipped package links the DISTRIBUTION's Qt, so it is installed in
      # a clean container of the same release and actually run. This catches a
      # Qt API newer than the floor and an under-declared Depends: line before
      # a user's `apt install` does.
      - name: Clean-room install + run
        run: |
          docker run --rm -v "$PWD/cpp/build/packaging":/pkg:ro \
            -v "$PWD/cpp/packaging/ci":/ci:ro \
            ubuntu:24.04 bash /ci/deb_container_verify.sh

      - name: Build portable + AppImage (x86_64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          mkdir -p "$dist"
          bash cpp/packaging/build_portable.sh "$dist"
          bash cpp/packaging/build_appimage.sh "$dist"
          ls -lh "$dist"

      - name: Verify portable bundle (x86_64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          test "$(tar -xOf "$dist/crowsnest-portable.tar.gz" ./ARCH)" = "x86_64"
          run_dir="$(mktemp -d)"
          tar -xzf "$dist/crowsnest-portable.tar.gz" -C "$run_dir"
          "$run_dir/run.sh" --dump > "${RUNNER_TEMP}/portable-dump.json"
          python3 - "${RUNNER_TEMP}/portable-dump.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["platform"] == "linux" and d["processCount"] > 0, d
          print("portable x86_64 ok:", d["processCount"], "procs")
          PY

          focus_bin="$(mktemp -d)"
          cat > "$focus_bin/gsettings" <<'G'
          #!/bin/sh
          case "$1" in get) echo "[]" ;; esac
          exit 0
          G
          chmod +x "$focus_bin/gsettings"
          focus_home="$(mktemp -d)"
          PATH="$focus_bin:$PATH" HOME="$focus_home" \
            XDG_CURRENT_DESKTOP=GNOME XDG_SESSION_TYPE=wayland \
            "$run_dir/run.sh" focus-bridge
          test -f "$focus_home/.local/share/gnome-shell/extensions/crowsnest-focus@codeafridi/extension.js"
          echo "portable x86_64 focus-bridge payload ok"

      - name: Verify AppImage (x86_64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          appimage="$(ls "$dist"/Crowsnest-*-x86_64.AppImage)"
          test -s "${appimage}.zsync"
          "$appimage" --appimage-updateinformation |
            grep -q 'Crowsnest-\*x86_64.AppImage.zsync'
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --dump \
            > "${RUNNER_TEMP}/appimage-dump.json"
          python3 - "${RUNNER_TEMP}/appimage-dump.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["platform"] == "linux" and d["processCount"] > 0, d
          print("appimage x86_64 ok:", d["processCount"], "procs")
          PY

      # One staging directory, flat: artifacts must not carry the AppDir,
      # .tools or a path prefix into the release, and the unified
      # SHA256SUMS has to be keyed by the asset's own basename.
      - name: Stage release assets
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          dest="$GITHUB_WORKSPACE/dist-release"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp cpp/build/packaging/*.deb "$dest/"
          cp "$dist/crowsnest-portable.tar.gz" "$dest/"
          cp "$dist"/Crowsnest-*-x86_64.AppImage "$dest/"
          cp "$dist"/Crowsnest-*-x86_64.AppImage.zsync "$dest/"
          ls -lh "$dest"

      - name: Checksums + AUR refresh data
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=$version/" cpp/packaging/arch/PKGBUILD cpp/packaging/arch/crowsnest-bin/PKGBUILD
          # Source tarball hash for the AUR `crowsnest` package (publish-aur.sh
          # runs updpkgsums anyway; this is a cross-check).
          curl -sL "https://github.com/codeafridi/Crowsnest/archive/refs/tags/v$version.tar.gz" -o /tmp/src.tar.gz
          echo "source tarball:" && sha256sum /tmp/src.tar.gz | tee /tmp/src.sha
          cp /tmp/src.sha "$GITHUB_WORKSPACE/cpp/build/packaging/SOURCE_SHA256.txt" 2>/dev/null || true

      - name: Validate packaging files
        run: |
          bash -n cpp/packaging/arch/publish-aur.sh
          bash -n cpp/packaging/build_ppa.sh
          bash -n cpp/packaging/build_appimage.sh
          bash -n cpp/packaging/verify_release.sh
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('cpp/packaging/obs/_service'); print('obs _service: valid XML')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist-release/*
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake qt6-base-dev libgl-dev libx11-dev \
            libxkbcommon-dev libglib2.0-dev libdbus-1-dev libicu-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Build and test (arm64)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir cpp/build --output-on-failure

      - name: Build .deb (arm64)
        run: bash cpp/packaging/build_deb.sh

      - name: Build portable + AppImage (arm64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          mkdir -p "$dist"
          bash cpp/packaging/build_portable.sh "$dist"
          bash cpp/packaging/build_appimage.sh "$dist"
          ls -lh "$dist"

      - name: Verify portable bundle (arm64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          run_dir="$(mktemp -d)"
          tar -xzf "$dist/crowsnest-portable-aarch64.tar.gz" -C "$run_dir"
          test "$(cat "$run_dir/ARCH")" = "aarch64"
          "$run_dir/run.sh" --dump > "${RUNNER_TEMP}/portable-dump.json"
          python3 - "${RUNNER_TEMP}/portable-dump.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["platform"] == "linux" and d["processCount"] > 0, d
          assert d["host"]["cores"] > 0, d
          print("portable aarch64 ok:", d["processCount"], "procs,",
                d["host"]["cores"], "cores")
          PY

          focus_bin="$(mktemp -d)"
          cat > "$focus_bin/gsettings" <<'G'
          #!/bin/sh
          case "$1" in get) echo "[]" ;; esac
          exit 0
          G
          chmod +x "$focus_bin/gsettings"
          focus_home="$(mktemp -d)"
          PATH="$focus_bin:$PATH" HOME="$focus_home" \
            XDG_CURRENT_DESKTOP=GNOME XDG_SESSION_TYPE=wayland \
            "$run_dir/run.sh" focus-bridge
          test -f "$focus_home/.local/share/gnome-shell/extensions/crowsnest-focus@codeafridi/extension.js"
          echo "portable aarch64 focus-bridge payload ok"

      - name: Verify AppImage (arm64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          appimage="$(ls "$dist"/Crowsnest-*-aarch64.AppImage)"
          test -s "${appimage}.zsync"
          "$appimage" --appimage-updateinformation |
            grep -q 'Crowsnest-\*aarch64.AppImage.zsync'
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --dump \
            > "${RUNNER_TEMP}/appimage-dump.json"
          python3 - "${RUNNER_TEMP}/appimage-dump.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["platform"] == "linux" and d["processCount"] > 0, d
          print("appimage aarch64 ok:", d["processCount"], "procs")
          PY

      - name: Installer smoke (arm64 local bundle)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          ( cd "$dist" && sha256sum crowsnest-portable-aarch64.tar.gz > SHA256SUMS )
          export CROWSNEST_BUNDLE_URL="file://${dist}/crowsnest-portable-aarch64.tar.gz"
          export CROWSNEST_SUMS_URL="file://${dist}/SHA256SUMS"
          sh install.sh --dry-run 2>&1 | tee "${RUNNER_TEMP}/plan.txt"
          grep -q "arch         aarch64 (crowsnest-portable-aarch64.tar.gz)" \
            "${RUNNER_TEMP}/plan.txt"
          sh install.sh --verify 2>&1 | tee "${RUNNER_TEMP}/verify.txt"
          grep -q "verified: crowsnest-portable-aarch64.tar.gz" "${RUNNER_TEMP}/verify.txt"
          test ! -d "$HOME/.local/opt/crowsnest"
          sh install.sh --no-bridge --no-autostart
          "$HOME/.local/opt/crowsnest/run.sh" --dump |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["processCount"]>0; print("arm64 install dump ok:", d["processCount"], "procs")'
          sh install.sh --uninstall
          test ! -d "$HOME/.local/opt/crowsnest"
          echo "arm64 installer ok"

      - name: Stage release assets (arm64)
        run: |
          dist="${RUNNER_TEMP}/linux-dist"
          dest="$GITHUB_WORKSPACE/dist-release"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp cpp/build/packaging/*.deb "$dest/"
          cp "$dist/crowsnest-portable-aarch64.tar.gz" "$dest/"
          cp "$dist"/Crowsnest-*-aarch64.AppImage "$dest/"
          cp "$dist"/Crowsnest-*-aarch64.AppImage.zsync "$dest/"
          ls -lh "$dest"

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-arm64
          path: dist-release/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: "6.8.*"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build, test and dump smoke
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release
          ctest --test-dir cpp/build -C Release --output-on-failure
          $json = $(cmd /c '"%CD%\cpp\build\Release\crowsnest.exe" --dump') | ConvertFrom-Json -AsHashtable
          $fs = $json.filesystems.entries
          if ($fs.Count -lt 1) { throw 'dump: no filesystem entries' }
          Write-Host ("windows fs ok: {0} entries" -f $fs.Count)
          if ($json.processCount -le 0) { throw "dump: no processes" }
          if ($json.host.cores -le 0) { throw "dump: no cores" }
          Write-Host ("windows dump ok: {0} procs" -f $json.processCount)

      - name: Build MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File cpp/packaging/windows/build_msi.ps1 -Version $version
          Get-ChildItem cpp/build/packaging

      - name: Write winget + Scoop manifests
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File cpp/packaging/windows/write_manifests.ps1 -Version $version
          Get-ChildItem cpp/packaging/windows/manifests/$version

      - name: Validate manifests (winget, if available)
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host 'winget CLI not present on runner; validate skipped'
            exit 0
          }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          winget validate "cpp/packaging/windows/manifests/$version"

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: |
            cpp/build/packaging/Crowsnest-*-windows.msi
            cpp/build/packaging/Crowsnest-*-windows.msi.sha256
            cpp/build/packaging/Crowsnest-*-windows-portable.zip
            cpp/build/packaging/Crowsnest-*-windows-portable.zip.sha256
          if-no-files-found: error

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v7
        with:
          name: crowsnest-winget-manifests
          path: cpp/packaging/windows/manifests/
          if-no-files-found: error

  checksums:
    needs: [build, build-macos, build-windows, build-linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Sigstore keyless signing mints a short-lived certificate from the
      # workflow's OIDC identity; no long-lived key is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist/linux
      - uses: actions/download-artifact@v8
        with:
          name: packages-arm64
          path: dist/arm64
      - uses: actions/download-artifact@v8
        with:
          name: packages-macos
          path: dist/macos
      - uses: actions/download-artifact@v8
        with:
          name: packages-windows
          path: dist/windows
      - name: Build the unified manifest
        run: |
          cd dist
          # Flat basenames: install.sh --verify looks an asset up by its own
          # name in SHA256SUMS, so ./linux/<name> would never match.
          find . -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -print0 |
            sort -z | xargs -0 sha256sum |
            sed 's|  \./[^/]*/|  |' > SHA256SUMS
          dupes="$(awk '{print $2}' SHA256SUMS | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "duplicate asset names make the manifest ambiguous: $dupes" >&2
            exit 1
          fi
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign and verify the manifest (Sigstore keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            dist/SHA256SUMS
          ls -l dist/SHA256SUMS dist/SHA256SUMS.sigstore.json

      - uses: actions/upload-artifact@v7
        with:
          name: packages-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error

  github-release:
    needs: [checksums]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist-ci
      - uses: actions/download-artifact@v8
        with:
          name: packages-macos
          path: dist-macos
      - uses: actions/download-artifact@v8
        with:
          name: packages-windows
          path: dist-windows
      - uses: actions/download-artifact@v8
        with:
          name: packages-arm64
          path: dist-arm64
      - uses: actions/download-artifact@v8
        with:
          name: packages-checksums
          path: dist-checksums
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-ci/*
            dist-arm64/*
            dist-macos/*
            dist-windows/*
            dist-checksums/SHA256SUMS
            dist-checksums/SHA256SUMS.sigstore.json
          generate_release_notes: true
      # NOTE: every artifact above is built by this workflow: the portable
      # bundles, AppImages (with zsync) and both .debs included. `crowsnest
      # update` and the AppImage delta channel read `latest` from the same
      # release, so all of them must be attached before the release is.
